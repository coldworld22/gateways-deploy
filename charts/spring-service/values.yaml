# Defaults are production-leaning: 2 replicas, non-root, read-only root filesystem, probes on
# Spring Boot Actuator, a PodDisruptionBudget and a default-deny NetworkPolicy for ingress.

image:
  repository: ""            # required
  tag: ""                   # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 2

containerPort: 8080

# Plain environment variables.
env: {}
#  SPRING_PROFILES_ACTIVE: prod

# Secrets are never put in values. Reference an existing Secret (created by External Secrets,
# Sealed Secrets, or kubectl in dev); every key becomes an environment variable.
existingSecret: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 768Mi

# JVM sizing follows the memory limit (the images run with -XX:MaxRAMPercentage=75).

probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30     # up to 150 s for JVM start and migrations
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Pods allowed to call this service, by label. Empty list = only same-namespace pods with
  # app.kubernetes.io/part-of=gateways.
  allowFrom: []
  # Allow traffic from the ingress controller namespace (for public webhooks).
  ingressNamespace: ""

ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecret: ""
  paths: ["/"]
  annotations: {}

serviceMonitor:
  enabled: false            # needs the Prometheus Operator CRDs (kube-prometheus-stack)
  interval: 30s

terminationGracePeriodSeconds: 40   # Spring "server.shutdown: graceful" waits up to 30 s

podAnnotations: {}
nodeSelector: {}
tolerations: []
