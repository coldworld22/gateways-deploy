# llm-gateway: OpenAI-compatible gateway (PostgreSQL + Redis).
# Secret "llm-gateway-secrets" provides DATABASE_PASSWORD and provider keys
# (OPENAI_API_KEY, AZURE_OPENAI_API_KEY); see docs/production.md.
image:
  repository: ghcr.io/coldworld22/llm-gateway
existingSecret: llm-gateway-secrets
env:
  DATABASE_URL: jdbc:postgresql://postgres:5432/llm_gateway
  DATABASE_USER: gateway
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  AZURE_OPENAI_BASE_URL: https://example.openai.azure.com/openai/v1
  AZURE_OPENAI_DEPLOYMENT: gpt-4o-mini
  OLLAMA_BASE_URL: http://ollama:11434/v1
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 768Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
